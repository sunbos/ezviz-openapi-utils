[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ezviz-unified"
version = "0.1.0a1"
description = "A third-party Python SDK for unified EZVIZ platform access"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28.1,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.14", "ruff>=0.9", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ezviz_unified*"]

[tool.setuptools.package-data]
ezviz_unified = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["live: explicitly enabled, separately authorized integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ezviz_unified"]
